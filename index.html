<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Tamu Digital - KPU Kab. Bolmut</title>
    
    <!-- KODE REDIRECT OTOMATIS: Ganti link di bawah dengan link Google Apps Script Anda -->
    <meta http-equiv="refresh" content="2;url=https://script.google.com/macros/s/AKfycbw1EF5NVFJRP865in9Aifhwf7Y6Vm1FPN9lHH82t-ooXjG3BjehuXajbu8qpLIdIPK1/exec">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            max-width: 400px;
            width: 100%;
        }
        .logo {
            width: 90px;
            margin-bottom: 20px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }
        h2 {
            color: #0f172a;
            margin: 0 0 5px 0;
            font-size: 20px;
            font-weight: 700;
        }
        p {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .loader {
            border: 4px solid #f1f5f9;
            border-top: 4px solid #b91c1c;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 1s linear infinite;
            margin: 0 auto 25px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #800000 0%, #b91c1c 100%);
            color: #ffffff;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 4px 12px rgba(185, 28, 28, 0.2);
            transition: transform 0.2s;
            width: 100%;
        }
        .btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/46/KPU_Logo.svg/500px-KPU_Logo.svg.png" alt="Logo KPU" class="logo">
        
        <div class="loader"></div>
        
        <h2>Menyiapkan Buku Tamu...</h2>
        <p>Komisi Pemilihan Umum<br>Kabupaten Bolaang Mongondow Utara</p>
        
        
    </div>

</body>
</html>
